name = "first-response-property-solutions"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Lead delivery uses Resend over HTTPS from the Pages Function — no bindings
# required. Set secrets in the Cloudflare dashboard (or `.dev.vars` locally):
#   TURNSTILE_SECRET_KEY, RESEND_API_KEY, LEAD_TO_EMAIL, LEAD_FROM_EMAIL
# and the public build var PUBLIC_TURNSTILE_SITE_KEY.
